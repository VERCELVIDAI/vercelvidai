  <!-- Play Arrow Triangle -->
  <path d="M19 14.5L23.5 17.5C24.2 18 24.2 19 23.5 19.5L19 22.5C18.3 23 17.5 22.5 17.5 21.6V15.4C17.5 14.5 18.3 14 19 14.5Z" fill="url(#fGrad)" />
